<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Finales: Copa de Europa / UEFA Champions League</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>

  <header class="header">
    <h1>Finales UEFA Champions League & Copa de Europa</h1>
    <p>Registro histórico detallado desde 1955 hasta la actualidad</p>
  </header>

  <section class="controls">
    <input type="text" id="searchInput" placeholder="Buscar por equipo, estadio, ciudad...">
    
    <select id="eraFilter">
      <option value="all">Todas las eras</option>
      <option value="copa-europa">Copa de Europa (1955-1992)</option>
      <option value="champions">UEFA Champions League (1993-Presente)</option>
    </select>
  </section>

  <main id="finalsGrid" class="grid-container"></main>

  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
